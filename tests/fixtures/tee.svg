  <!-- A T whose stem stops 0.6 short of the bar, 0.375% of the drawing's 160: two strokes that nearly
       touch, but not end to end. The pen crosses there with the pen down and walks back along the
       lines instead of jumping (DECISIONS.md D46). -->
